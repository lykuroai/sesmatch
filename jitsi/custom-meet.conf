# SES DirectMatch 向け（2026-11-05）。docker-jitsi-meet が meet.conf の末尾に連結する（/config/nginx/custom-meet.conf）。
# - /custom/ : ロゴなどの静的ファイル（/config/custom-static/）
# - /css/all.css : 既定の CSS にロゴ枠の上書き（custom.css）を連結したもの。^~ で既定の正規表現 location より優先させる
location ^~ /custom/ {
    alias /run/web/config/custom-static/;
    add_header Cache-Control "public, max-age=3600";
}
location ^~ /css/all.css {
    alias /run/web/config/custom-static/all.css;
    default_type text/css;
}
