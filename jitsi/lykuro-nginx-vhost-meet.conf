
# --- Jitsi Meet（ses.lykuro.ai の Web 会議、2026-11-05 暫定）。
# 経路: meet.lykuro.ai → Cloudflare → ALB（TLS 終端）→ 本 nginx:80 → Jitsi web（host 8000、http）。
# XMPP/colibri は WebSocket のため Upgrade を透過し、タイムアウトを延長する。映像・音声は 10000/udp で本ホストへ直接。
server {
    listen 80;
    server_name meet.lykuro.ai;

    client_max_body_size 10m;

    location / {
        proxy_pass http://host.docker.internal:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_redirect off;
    }
}
