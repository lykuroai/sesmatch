# EC2 本番用 compose。イメージはローカルでビルドし scripts/release-ec2.sh で転送する（build しない）。
# 起動: IMAGE_TAG=<tag> docker compose -f docker-compose.ec2.yml --env-file .env.production up -d
# IMAGE_TAG 未指定時は latest（リリーススクリプトが最新版に latest を付け直す）
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-sesmatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # EC2 内ループバックのみ。ローカルからは SSH トンネル経由（scripts/db-tunnel.sh）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:-sesmatch}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: sesmatch-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-sesmatch}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: sesmatch-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # リバースプロキシ（HTTPS終端）経由で公開すること
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-sesmatch}
      SESSION_SECRET: ${SESSION_SECRET:?}
      PLATFORM_ADMIN_TOKEN: ${PLATFORM_ADMIN_TOKEN:?}
      STORAGE_DIR: /data/storage
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # メール配信（Amazon SES）。MAIL_FROM 未設定ならログのみのモック動作
      MAIL_FROM: ${MAIL_FROM:-}
      FROM_NAME: ${FROM_NAME:-}
      # お問合せ受付の運営宛通知先（未設定なら通知メールなし）
      OPERATIONS_MAIL: ${OPERATIONS_MAIL:-}
      APP_BASE_URL: ${APP_BASE_URL:-https://ses.lykuro.ai}
      AWS_REGION: ${AWS_REGION:-ap-northeast-1}
      # EC2 インスタンスロールを使う場合は以下2つは不要
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # --- PRO 版（ses_directmatch_pro_spec_v1_0.md）。値は .env.production で管理（雛形 .env.production.example）---
      # 保存データの暗号鍵（Webhook URL・2要素の秘密鍵・SSO 設定）。未設定なら SESSION_SECRET から派生
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      # IP 制限の接続元判定: X-Forwarded-For の右端から数える信頼段数。ALB + nginx なので 2
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      # 新着アラート・定期処理のスケジューラ（0 で停止）
      ALERT_SCHEDULER: ${ALERT_SCHEDULER:-1}
      # Web 会議（Jitsi 本体は別インスタンス。未設定なら機能停止）
      JITSI_DOMAIN: ${JITSI_DOMAIN:-}
      JITSI_APP_ID: ${JITSI_APP_ID:-}
      JITSI_APP_SECRET: ${JITSI_APP_SECRET:-}
      # カード決済（Stripe。4つ揃うまで機能停止）
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
      STRIPE_TAX_RATE_ID: ${STRIPE_TAX_RATE_ID:-}
    volumes:
      - storage:/data/storage # 原本ファイル（§9.2）
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  storage:
