# SESマッチングプラットフォーム: EC2 上の nginx 設定
# ALB(HTTPS終端) → nginx(:80) → app(127.0.0.1:3000)
# 配置先: /etc/nginx/sites-available/sesmatch（scripts/setup-ec2-web.sh が配置する）
server {
    listen 80 default_server;
    server_name ses.lykuro.ai _;

    # スキルシート等のファイルアップロード（取込 §9）
    client_max_body_size 25m;

    # ALB ヘルスチェック（nginx が直接応答。app/DB の死活は /api/v1/health で確認可）
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ALB が付与した X-Forwarded-Proto (https) をそのまま引き継ぐ
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # 取込確定は LLM 正規化を同期実行するため長め（ALB のアイドルタイムアウトも合わせる）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
